[package]
name = "agent-toolbox"
version = "0.2.5"
edition = "2024"
rust-version = "1.98.0"
description = "Command-line tools for running and operating AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/Luolc/agent-toolbox"
readme = "README.md"
keywords = ["cli", "ai-agents", "claude", "codex", "linear"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/LICENSE", "/README.md"]

[[bin]]
name = "atb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
os_info = { version = "3.15.0", default-features = false }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
