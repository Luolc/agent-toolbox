[title]
en = "Make every credential location overridable"

[text.statement]
en = "Make every credential location `atb` reads overridable by `--config-dir`, by the harness's own variable and by `ATB_HOME`, and list the order in which they apply in the README."

[text.reason]
en = '''
Tests and users must be able to point `atb` away from the real home, so that a test never touches a real credential.
'''

[text.verification]
en = '''
Violated when a change adds a credential location that none of the three overrides, or changes the order without changing the README.
'''
