[title]
en = "Tests read credentials only from synthetic files under a temporary home"

[text.statement]
en = "In tests, let `atb` read credentials only from synthetic files under a temporary home, never from the real one."

[text.reason]
en = '''
A test that reads the real home could print or send a real token, and passes or fails with the machine it runs on.
'''

[text.verification]
en = '''
Violated when a test runs `atb` or its credential code without the home, the harness variables and `ATB_HOME` pointed to a temporary directory that holds synthetic files.
'''
