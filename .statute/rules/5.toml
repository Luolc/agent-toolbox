[title]
en = "Read vendor CLI credentials only to build request headers"

[text.statement]
en = "Let `atb` read the vendor CLI credentials (`~/.claude/.credentials.json`, `~/.codex/auth.json`, `~/.grok/auth.json`) only to build the headers of its requests."

[text.reason]
en = '''
Those files hold the user's logins to other tools; reading them for anything else widens what a bug in `atb` could expose.
'''

[text.verification]
en = '''
Violated when a change uses a value from one of those files for anything but a request header, or writes to one of them.
'''
