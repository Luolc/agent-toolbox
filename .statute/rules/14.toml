[title]
en = "Keep no decision records, research notes or to-do list here"

[text.statement]
en = "Keep no decision records, research notes or to-do list in this repository; open work is tracked outside it, and a decision and its reasons go into the pull request that makes it."

[text.reason]
en = '''
The repository holds the code, the one design document and the manuals; what is decided is in the code and the design, and why in the pull requests.
'''

[text.verification]
en = '''
Violated when a change adds a decision record, a research note or a list of open work to the repository.
'''
