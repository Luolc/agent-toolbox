[title]
en = "Review against the skill atb-pr-review too"

[text.statement]
en = "When you review a pull request in this repository, check it also against the skill `atb-pr-review` (`.agents/skills/atb-pr-review/SKILL.md`)."

[text.reason]
en = '''
The skill holds the review points that only this repository has: credentials in output, daemons and retries, the shape of HTTP calls.
'''

[text.verification]
en = '''
Violated when a verdict on a pull request here does not go through the points of that skill.
'''
