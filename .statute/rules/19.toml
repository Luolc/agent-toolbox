id = 19
slug = "patch-releases"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = "R268"
default = "on"
authority = ["list-defaults.tightening", "advance-authorization.listed-items", "advance-authorization.as-written"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "A release that breaks nothing raises only the patch number, and an agent may make it"

[text.statement]
en = "When an agent judges that no change since the last release of `atb` is a breaking change, it may raise only the patch number and push that release's tag without asking a person, and the release then counts as a person's yes for that version wherever pinning `atb` to it or installing it on machines asks for one; raising the minor or major number needs a person's yes for that version, given at the time or written down in advance."

[text.reason]
en = '''
The owner asked for this rule. A minor or major version tells the users of `atb` that something they rely on may have changed; whether that is so is the owner's call, which this rule adds to what goes through a principal ({@constitution:list-defaults.tightening}). The patch releases are the owner's advance authorization of one class of releases, written into this repository's instructions as {@constitution:advance-authorization.listed-items} requires; it counts only as written and within its conditions ({@constitution:advance-authorization.as-written}). The repositories that install `atb` on machines keep their own instructions for how and when a version is pinned and installed; this rule only answers, for them, whether a person agreed to the version.
'''

[text.verification]
en = '''
The version is `version` in the root `Cargo.toml`; a patch release raises only the patch number of the highest version of `atb` already released. A breaking change is one after which a command, flag, output format, exit status or file location that users or scripts rely on behaves differently or is gone. An agent unsure whether a change breaks something treats it as breaking. A release outside these conditions (raising the minor or major number, or one whose changes the releasing agent did not judge free of breaking changes) needs a person's yes.

Violated when a change raises the minor or major number of `atb` without a person's word for that version, when a patch release ships a change its releasing agent knew or judged to be breaking, or when a release this authorization does not cover is made without a person's yes.
'''
