id = 11
slug = "key-command-stderr-hidden"
revision = 1
kind = "rule"
status = "trial"
lang = "en"
parent = "R83"
default = "on"
authority = ["sensitive-info"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Never show the standard error of the Linear key command"

[text.statement]
en = "Never show the standard error of the command in `LINEAR_API_KEY_CMD`; report its failure by its exit status only."

[text.reason]
en = '''
The command talks to a secret manager, and what it writes to standard error may hold the key or details of the store.
'''

[text.verification]
en = '''
Violated when a code path passes that command's standard error to the terminal, a log or an error message.
'''
