[title]
en = "Shape commands as `atb <tool> <harness>`"

[text.statement]
en = "Shape each `atb` command as `atb <tool> <harness>`, tool first and the harness (`claude`, `codex` or `grok`) second as a positional argument, as in `atb quota codex`; a tool that targets no harness takes its own subcommands, as in `atb linear claim`."

[text.reason]
en = '''
One shape for every tool keeps the command tree predictable for the agents and scripts that call it.
'''

[text.verification]
en = '''
Violated when a change adds a command whose harness is a flag or comes before the tool, or a tool with no harness whose actions are flags instead of subcommands.
'''
