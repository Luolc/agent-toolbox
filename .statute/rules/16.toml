[title]
en = "Install the commit hooks in each clone"

[text.statement]
en = "In each clone of this repository, run `pre-commit install` once, before the first commit."

[text.reason]
en = '''
The hooks scan the staged changes for credentials and check the formatting and the compiled instructions; they run only once installed.
'''

[text.verification]
en = '''
Violated when a commit is made in a clone whose commit hook does not run pre-commit.
'''
