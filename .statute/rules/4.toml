[title]
en = "Keep machine-specific integration out of this repository"

[text.statement]
en = "Keep machine-specific integration, such as the wiring for particular machines, secret-manager references and the conventions of one workspace, out of this repository; it belongs to the repositories that use `atb`."

[text.reason]
en = '''
This repository is public and serves any machine; what binds `atb` to one setup changes with that setup and is kept with it.
'''

[text.verification]
en = '''
Violated when a change adds a host name, a secret-manager reference, a path or name that only one machine or workspace has, or code that works only there.
'''
