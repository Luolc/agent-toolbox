# PR and main check: credential scan of the new commits, then fmt / clippy /
# test / doc, the design document length, the tests of the release checks
# and the statute compile check. The job name `check` is the required status
# check on main. A release reads the result of this workflow on main (the
# `ci-green` job of release.yml).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own, since a release reads it, so
  # each one gets its own group: a shared group would cancel a pending run
  # when a newer one arrives. On a PR branch, a newer push cancels the older
  # run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the commits of the PR

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan below reads the commits of the PR or push, which a
          # shallow clone would not have.
          fetch-depth: 0

      # pre-commit's gitleaks hook only sees the staged diff; CI has no
      # staging area, so this step scans the commits of this PR or push, and
      # gitleaks.yml scans the whole history weekly. The action runs gitleaks
      # with --redact, so a hit does not print the secret into the log.
      - name: Credential scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The version the pre-commit hook pins.
          GITLEAKS_VERSION: 8.30.1
          # Commenting on the PR would need pull-requests: write; the job
          # log and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

      # rust-toolchain.toml pins the channel and components; rustup installs
      # them on first use.
      - name: Rust toolchain
        run: rustup show

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo test --locked

      - name: Rust docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked

      - name: Design document length
        run: |
          .github/scripts/design-length.test.sh
          .github/scripts/design-length.sh

      - name: Release check tests
        run: .github/scripts/release-on-main.test.sh

      # AGENTS.md and the installed skills must match a fresh compile of
      # statute.toml and statute.lock, with the statute version that
      # statute.lock names (the one that compiled them). A lock written before
      # statute 0.1.18 has no version line; its checks file has it.
      - name: statute version
        id: statute
        run: |
          version=$(sed -n 's/^statute = "\(.*\)"$/\1/p' statute.lock)
          [ -n "$version" ] || version=$(sed -n 's/^statute = "\(.*\)"$/\1/p' statute-checks.toml)
          [ -n "$version" ] || { echo "no statute version in statute.lock" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: install statute
        env:
          VERSION: ${{ steps.statute.outputs.version }}
        run: |
          target=statute-x86_64-unknown-linux-musl
          url="https://github.com/Luolc/agent-constitution/releases/download/statute-v${VERSION}"
          dl=$(mktemp -d)
          curl --fail --silent --show-error --location --output "$dl/$target.tar.gz" "$url/$target.tar.gz"
          curl --fail --silent --show-error --location --output "$dl/$target.sha256" "$url/$target.sha256"
          (cd "$dl" && sha256sum --check --strict "$target.sha256")
          bin="$RUNNER_TEMP/statute-bin"
          mkdir -p "$bin" "$dl/x"
          tar -xzf "$dl/$target.tar.gz" -C "$dl/x" statute
          install -m 0755 "$dl/x/statute" "$bin/statute"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/statute" --version

      - name: statute compile check
        run: statute compile --check
