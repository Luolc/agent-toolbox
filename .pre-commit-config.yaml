# Second-level hooks only: credential scan (gitleaks), rustfmt and the
# statute compile check. Clippy, tests and docs run before push and in CI.
repos:
  # Runs first: a leaked credential must be caught before any other hook
  # rewrites the staged file. Scans only the staged diff (upstream entry ends
  # in --staged); CI scans full history instead. --redact is repeated on
  # purpose so a rev bump cannot silently drop it.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rust format (cargo fmt)
        language: system
        entry: cargo fmt --check
        files: (\.rs$|^Cargo\.toml$|^\.?rustfmt\.toml$|^rust-toolchain\.toml$)
        pass_filenames: false
  # --check writes nothing: AGENTS.md and the skills statute copies and links
  # must match a fresh compile of statute.toml and statute.lock. The private
  # output, which git ignores, is not compared. The mirror installs statute
  # from PyPI at the version of `rev`, which must be the version statute.lock
  # names: when they differ, statute refuses the lock and the hook fails.
  - repo: https://github.com/Luolc/statute-pre-commit
    rev: v0.1.25
    hooks:
      - id: statute-compile
