# Second-level hooks only: credential scan (gitleaks) and rustfmt. Clippy,
# tests and docs run before push and in CI (see AGENTS.md).
repos:
  # Runs first: a leaked credential must be caught before any other hook
  # rewrites the staged file. Scans only the staged diff (upstream entry ends
  # in --staged); CI scans full history instead. --redact is repeated on
  # purpose so a rev bump cannot silently drop it.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rust format (cargo fmt)
        language: system
        entry: cargo fmt --check
        files: (\.rs$|^Cargo\.toml$|^\.?rustfmt\.toml$|^rust-toolchain\.toml$)
        pass_filenames: false
